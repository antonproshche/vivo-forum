<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Образовательный форум Вивомаркет — пространство для обмена знаниями, опытом и идеями. Скоро открытие новой образовательной площадки.">
  <title>Образовательный форум Вивомаркет</title>
  <style>
    :root {
      color-scheme: light;
      --background: #F7F8FA;
      --primary: #19364A;
      --accent: #FF8566;
      --text: #243746;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .container { width: min(1100px, calc(100% - 48px)); margin-inline: auto; }
    .header { padding-block: 32px; }
    .brand { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 24px; }
    .brand-name {
      color: var(--primary);
      font-size: 23px;
      font-weight: 800;
      letter-spacing: .055em;
      line-height: 1.3;
    }
    .brand-label {
      padding-left: 24px;
      border-left: 1px solid #D7DFE4;
      font-size: 14px;
    }
    main { flex: 1; display: flex; align-items: center; padding-block: 40px 64px; }
    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(32px, 7vw, 88px);
      background: #FFFFFF;
      border: 1px solid #E3E9ED;
      border-radius: 32px;
      box-shadow: 0 16px 48px rgb(25 54 74 / 4%);
    }
    .hero::before {
      content: "";
      display: block;
      width: 56px;
      height: 6px;
      margin-bottom: 32px;
      border-radius: 6px;
      background: var(--accent);
    }
    h1 {
      max-width: 820px;
      margin: 0;
      color: var(--primary);
      font-size: clamp(32px, 5.4vw, 60px);
      font-weight: 750;
      letter-spacing: -.035em;
      line-height: 1.14;
      overflow-wrap: break-word;
    }
    .subtitle {
      max-width: 640px;
      margin: 24px 0 36px;
      font-size: clamp(18px, 2.2vw, 22px);
      line-height: 1.6;
    }
    .status {
      max-width: 620px;
      margin-bottom: 32px;
      padding: 20px 24px;
      border-left: 3px solid var(--accent);
      border-radius: 0 14px 14px 0;
      background: #FFF3EF;
    }
    .status p { margin: 0; }
    .status strong { display: block; margin-bottom: 4px; color: var(--primary); font-size: 18px; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 54px;
      padding: 14px 24px;
      border: 2px solid transparent;
      border-radius: 12px;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 650;
      line-height: 1.5;
      text-align: center;
      text-decoration: none;
    }
    .button::after { content: "↗"; font-size: 21px; line-height: 1; }
    .button:hover { background: #284E65; }
    .button:focus-visible { outline: 3px solid var(--primary); outline-offset: 4px; border-color: var(--accent); }
    .footer {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 24px;
      padding-block: 24px 32px;
      border-top: 1px solid #DDE4E9;
      font-size: 14px;
    }
    .footer p { margin: 0; }
    @media (max-width: 600px) {
      .container { width: calc(100% - 32px); }
      .header { padding-block: 24px; }
      .brand { align-items: flex-start; flex-direction: column; gap: 4px; }
      .brand-name { font-size: 21px; }
      .brand-label { padding-left: 0; border-left: 0; }
      main { padding-block: 16px 40px; }
      .hero { padding: 32px 24px; border-radius: 24px; }
      .hero::before { margin-bottom: 24px; }
      .subtitle { margin-block: 20px 28px; }
      .status { padding: 16px 18px; }
      .button { width: 100%; padding-inline: 14px; }
      .footer { flex-direction: column; padding-bottom: 24px; }
    }
  </style>
</head>
<body>
  <header class="header container">
    <div class="brand">
      <span class="brand-name">ВИВОМАРКЕТ</span>
      <span class="brand-label">Образовательный форум</span>
    </div>
  </header>
  <main class="container">
    <section class="hero" aria-labelledby="forum-title">
      <h1 id="forum-title">Образовательный форум Вивомаркет</h1>
      <p class="subtitle">Пространство для обмена знаниями, опытом и идеями.</p>
      <div class="status">
        <p><strong>Скоро открытие!</strong> Мы готовим для вас новую образовательную площадку.</p>
      </div>
      <a class="button" href="https://vivomarket.ru">Перейти на основной сайт</a>
    </section>
  </main>
  <footer class="footer container">
    <p>© 2026 Вивомаркет</p>
    <p>Сайт находится в разработке</p>
  </footer>
</body>
</html>
